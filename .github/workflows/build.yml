name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest  # GitHub-hosted Windows runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/ComputerRenameTool/ComputerRenameTool.csproj

      - name: Build
        run: dotnet build src/ComputerRenameTool/ComputerRenameTool.csproj -c Release --no-restore

      - name: Publish (single-file EXE)
        run: |
          dotnet publish src/ComputerRenameTool/ComputerRenameTool.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -o publish/

      - name: Verify EXE size
        run: |
          $size = (Get-Item publish/ComputerRenameTool.exe).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "EXE size: ${sizeMB} MB"
          if ($sizeMB -gt 50) {
            Write-Error "EXE too large: ${sizeMB} MB (limit 50 MB)"
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComputerRenameTool-win-x64
          path: publish/ComputerRenameTool.exe
          retention-days: 30

      - name: Upload to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/ComputerRenameTool.exe
          generate_release_notes: true
